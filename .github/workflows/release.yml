# Builds the two Windows programs the README sends people to download, the
# command line bot (SteamGiftBot.exe) and the bot farm (BotFarm.exe), checks
# that each starts, and attaches both to the GitHub Release for the tag with
# the tag's section of CHANGELOG.md as the release text.
#
#   git tag v3.0.0 && git push origin v3.0.0

name: Release

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.1

      - name: Build the executables
        run: |
          pyinstaller SteamGiftBot.spec --noconfirm
          pyinstaller BotFarm.spec --noconfirm

      # A packed build breaks in ways the test suite cannot see: a data file
      # left out of the bundle, or a settings path pointing inside the folder
      # PyInstaller deletes on exit.
      - name: Check the executable
        shell: bash
        run: |
          # Actions runs bash with -e, which would stop at the first check that
          # is meant to exit non-zero. Every code is collected and judged below.
          set +e -u
          failures=0

          check() {
            if [ "$1" = "0" ]; then printf '  PASS  %s\n' "$2"
            else printf '  FAIL  %s\n' "$2"; failures=$((failures + 1)); fi
          }

          ./dist/SteamGiftBot.exe --version
          check $? "--version answers"

          ./dist/SteamGiftBot.exe --no-input --config nowhere.ini > out.txt 2>&1
          [ "$?" = "2" ]
          check $? "an empty setup exits 2 instead of asking"

          # info.json has to survive the packing, and config.ini has to be
          # looked for beside the .exe rather than in the unpacked temp folder.
          cd dist
          printf '[DEFAULT]\ncookie=fake\nlog_info=no\ngift_type=All\npinned=no\nmin_points=0\ncheck_wins=no\n' > config.ini
          ./SteamGiftBot.exe --no-input --once --dry-run > run.txt 2>&1
          code=$?
          cd ..
          [ "$code" = "1" ]
          check $? "it reads a config.ini placed next to it (exit $code)"

          rm -f dist/config.ini dist/run.txt out.txt

          # The farm: its panel page, icons and translations have to be in the
          # bundle, and its data has to land beside the .exe.
          ./dist/BotFarm.exe --help > /dev/null
          check $? "BotFarm.exe --help answers"
          mkdir farmtest && cp dist/BotFarm.exe farmtest/
          cd farmtest
          BOTFARM_PASSWORD=release-check ./BotFarm.exe --set-password > setup.txt 2>&1
          check $? "the panel password can be set"
          BOTFARM_NO_BROWSER=1 ./BotFarm.exe --port 8099 --no-autostart > run.txt 2>&1 &
          farm=$!
          up=1
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/api/session > session.json && { up=0; break; }
            sleep 2
          done
          check $up "the panel answers"
          curl -sf http://127.0.0.1:8099/ | grep -q 'manifest.webmanifest'
          check $? "the panel page is in the bundle"
          curl -sf http://127.0.0.1:8099/icon.svg > /dev/null
          check $? "the panel icons are in the bundle"
          [ -f farm.json ]
          check $? "farm.json is written beside the .exe"
          kill $farm 2>/dev/null; taskkill //F //IM BotFarm.exe > /dev/null 2>&1
          cat run.txt
          cd ..
          rm -rf farmtest

          [ "$failures" = "0" ] || { echo "$failures check(s) failed"; exit 1; }
          echo "Both executables work."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SteamGiftBot-windows
          path: |
            dist/SteamGiftBot.exe
            dist/BotFarm.exe
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SteamGiftBot-windows
          path: dist

      # The programs are not code signed, so the checksum is how a download
      # can be told apart from a tampered copy.
      - name: Write the checksums
        working-directory: dist
        run: |
          sha256sum SteamGiftBot.exe > SteamGiftBot.exe.sha256
          sha256sum BotFarm.exe > BotFarm.exe.sha256

      # The tag's own section of CHANGELOG.md, from its heading to the next.
      - name: Take the release text from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: Attach the executables to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: SteamGiftBot ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/BotFarm.exe
            dist/BotFarm.exe.sha256
            dist/SteamGiftBot.exe
            dist/SteamGiftBot.exe.sha256
