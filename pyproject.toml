[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "steamgiftbot"
description = "Enters SteamGifts giveaways for you and tells you on Telegram when you win."
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.10"
authors = [{ name = "PalmaLuv" }]
# The version lives in steamgiftbot/__init__.py; the dependencies stay pinned in
# requirements.txt, which the Docker image and the .exe build install as well.
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[project.scripts]
steamgiftbot = "steamgiftbot.cli:main"

[project.urls]
Homepage = "https://github.com/PalmaLuv/SteamGiftBot"

[tool.setuptools.dynamic]
version = { attr = "steamgiftbot.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["steamgiftbot*"]

[tool.setuptools.package-data]
steamgiftbot = ["info.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so the package imports without being installed.
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["env", ".venv", "build", "dist"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, B bugbear, C4 comprehensions, UP pyupgrade.
select = ["E", "W", "F", "B", "C4", "UP"]
# The project spells things in camelCase and shadows a couple of builtins in
# long standing public signatures; renaming those would break callers.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
