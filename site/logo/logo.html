<!doctype html>
<!-- The README logo. Rendered to docs/images/logo-{dark,light}.png with
     Playwright: open logo.html?layout=stack&theme=dark (or light), screenshot
     .wrap at device scale 2 with a transparent background. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=block">
<style>
  html, body { margin: 0; background: transparent; }
  .wrap { display: inline-flex; align-items: center; padding: 24px; font-family: 'Manrope', sans-serif; }
  .stack { flex-direction: column; gap: 14px; }
  .row { flex-direction: row; gap: 26px; }
  .word { font-weight: 800; letter-spacing: -0.035em; line-height: 1; white-space: nowrap; }
  .stack .word { font-size: 92px; }
  .row .word { font-size: 104px; }
  .dark .word { color: #e5ecf2; } .dark .bot { color: #66c0f4; }
  .light .word { color: #1b2838; } .light .bot { color: #1766b5; }
  svg.mark { display: block; }
</style></head>
<body>
<template id="mark">
<svg class="mark" viewBox="0 0 200 228" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#47bfff"/><stop offset="1" stop-color="#1a44c2"/></linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".14"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0b1a2e" flood-opacity=".35"/></filter>
  </defs>
  <!-- a shield, as the old logo had, in the project's blue -->
  <path filter="url(#sh)" d="M18 8h164a8 8 0 0 1 8 8.6l-13.2 150a10 10 0 0 1-5.6 8.1L104.6 216a10 10 0 0 1-9.2 0l-66.6-41.3a10 10 0 0 1-5.6-8.1L10 16.6A8 8 0 0 1 18 8z" fill="url(#g)"/>
  <path d="M100 8h82a8 8 0 0 1 8 8.6l-13.2 150a10 10 0 0 1-5.6 8.1L104.6 216a10 10 0 0 1-4.6 1.2z" fill="url(#hi)"/>
  <!-- the gift box -->
  <g fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <path d="M52 100h96v62a6 6 0 0 1-6 6H58a6 6 0 0 1-6-6z"/>
    <path d="M44 76h112v24H44z"/>
    <path d="M100 76v92"/>
    <path d="M100 76c-10-22-38-26-38-10 0 9 19 10 38 10zm0 0c10-22 38-26 38-10 0 9-19 10-38 10z"/>
  </g>
</svg>
</template>
<div id="stage"></div>
<script>
  const mark = (size) => { const t = document.getElementById('mark').content.firstElementChild.cloneNode(true); t.setAttribute('width', size); t.setAttribute('height', Math.round(size * 228 / 200)); return t; };
  const params = new URLSearchParams(location.search);
  const layout = params.get('layout'), theme = params.get('theme');
  const w = document.createElement('div'); w.className = `wrap ${layout} ${theme}`;
  w.appendChild(mark(layout === 'stack' ? 220 : 150));
  const word = document.createElement('div'); word.className = 'word'; word.innerHTML = 'SteamGift<span class="bot">Bot</span>';
  w.appendChild(word); document.getElementById('stage').appendChild(w);
</script>
</body></html>
