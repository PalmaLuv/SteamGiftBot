<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бот-ферма">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Бот-ферма</title>
<style>
/* Dressed like a game store and client, same tokens as the project page:
   navy #1b2838, the #171a21 bar, light-blue links, blue buttons for actions,
   green for "take it", square corners. Statuses use the friends-list colours:
   in game (running) green, online (waiting) blue, offline (stopped) grey. */
:root{
  --bg:#1b2838;--bar:#171a21;--panel:#16202d;--panel2:#213245;--line:#2a3f55;--field:#5d7a93;--text:#dce5ec;--muted:#9aa4ad;
  --link:#66c0f4;--primary:#1a6fc4;--ok:#90ba3c;--warn:#e0a526;--bad:#ef6f68;--sleep:#57cbde;--off:#898989;--focus:#66c0f4;
  --btn:linear-gradient(90deg,#1f78cc 0%,#1756ad 100%);--btn-hi:linear-gradient(90deg,#2585dd 0%,#1a62c2 100%);
  --btn-go:linear-gradient(90deg,#4f7f1b 0%,#3f6614 100%);--btn-go-hi:linear-gradient(90deg,#5a8f20 0%,#487318 100%);
  --mark:linear-gradient(135deg,#47bfff 0%,#1a44c2 100%);--tint:rgba(103,193,245,.14);--tint-ink:#67c1f5;
  --row-hover:linear-gradient(90deg,#c6e6f8 5%,#95bcd3 95%);--row-ink:#10161b;
  --card:linear-gradient(180deg,rgba(42,71,94,.45) 0%,rgba(22,32,45,.9) 100%);
  --radius:4px;--nav:224px;font-synthesis:none;
  /* set per theme by the 'Оформление' settings (applyTheme) */
  --strong:#fff;--on-accent:#fff;--accent:#1a9fff;--input:#0f1822;--log-bg:#0e141b;--glow:rgba(42,71,94,.9);
  /* one colour per site, checked for colour-blind separation on --panel */
  --s-steamgifts:#3987e5;--s-indiegala:#d95926;--s-opiumpulses:#199e70;--s-other:#c98500;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:radial-gradient(ellipse 80% 420px at 60% -60px,var(--glow),transparent 70%),var(--bg);background-repeat:no-repeat;color:var(--text);font:14px/1.5 "Motiva Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline;color:var(--strong)}
h1{font-size:22px;margin:0;line-height:1.25;color:var(--strong);font-weight:600}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button,.btn{display:inline-flex;align-items:center;gap:6px;background:var(--tint);border:1px solid transparent;border-radius:3px;padding:7px 12px;min-height:36px;cursor:pointer;color:var(--tint-ink);text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
button:hover,.btn:hover{background:#67c1f5;color:var(--row-ink);text-decoration:none}
button.primary,.btn.primary{background:var(--btn);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
button.primary:hover,.btn.primary:hover{background:var(--btn-hi);color:var(--on-accent)}
button.go,.btn.go{background:var(--btn-go);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
button.go:hover,.btn.go:hover{background:var(--btn-go-hi);color:var(--on-accent)}
button.danger{color:var(--bad);background:rgba(239,111,104,.1)}
button.danger:hover{background:var(--bad);color:#1f0b0a}
button.ghost{background:none;border-color:transparent;color:var(--muted)}
button.ghost:hover{background:var(--tint);color:var(--strong)}
button:disabled{opacity:.45;cursor:default;pointer-events:none}
button.icon{padding:6px;min-width:36px;justify-content:center}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,select,textarea{background:var(--input);border:1px solid var(--field);border-radius:3px;padding:8px 10px;width:100%;min-height:38px}
textarea{min-height:90px;resize:vertical;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- shell ---- */
.shell{display:grid;grid-template-columns:var(--nav) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--bar);border-right:1px solid rgba(102,192,244,.08);display:flex;flex-direction:column;padding:16px 12px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--strong);padding:4px 8px 16px}
.brand img{width:30px;height:30px;border-radius:4px;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:3px;color:#b8b6b4;font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;border-left:3px solid transparent}
.nav a:hover{background:color-mix(in srgb,var(--link) 8%,transparent);color:var(--strong);text-decoration:none}
.nav a.on{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,transparent),transparent);color:var(--strong);border-left-color:var(--accent)}
.nav a.on svg{color:var(--link)}
.badge{margin-left:auto;background:var(--ok);color:#0b1a12;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;min-width:20px;text-align:center}
.badge.bad{background:var(--bad);color:#1f0b0a}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);padding:8px}
.content{padding:24px 28px 40px;max-width:1240px;width:100%;margin:0 auto}
.page-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:18px}
.page-head .lead{flex:0 0 100%;color:var(--muted)}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;margin-bottom:6px}
.tabbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .content{padding:16px 16px 96px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bar);border-top:1px solid rgba(102,192,244,.12);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:52px;color:var(--muted);font-size:11px;position:relative}
  .tabbar a.on{color:var(--strong);box-shadow:inset 0 2px 0 var(--accent)}
  .tabbar a.on svg{color:var(--link)}
  .tabbar .dot{position:absolute;top:4px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--ok)}
  button,.btn{min-height:44px}
  button.icon{min-width:44px}
  h1{font-size:20px}
}

/* ---- blocks ---- */
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.block + .block,.stack > * + *{margin-top:16px}
.block-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.block-head a{margin-left:auto;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pill{font-size:12px;padding:2px 9px;border-radius:3px;border:0;background:rgba(0,0,0,.25);box-shadow:inset 3px 0 0 currentColor;white-space:nowrap}
.s-running{color:var(--ok)}.s-sleeping{color:var(--sleep)}.s-stopped{color:var(--off)}
.s-error{color:var(--warn)}.s-auth{color:var(--bad)}.s-unset{color:var(--muted)}
.dot-site{width:10px;height:10px;border-radius:3px;flex:none}
.why{font-size:13px;background:var(--panel2);border-radius:8px;padding:7px 10px}
.err{background:rgba(239,111,104,.1);border:1px solid rgba(239,111,104,.4);color:#f2a19c;border-radius:8px;padding:8px 10px;font-size:13px;word-break:break-word}
.okbox{background:rgba(164,208,7,.1);border:1px solid rgba(164,208,7,.4);border-radius:8px;padding:10px 12px}
.note{background:rgba(224,165,38,.08);border:1px solid rgba(224,165,38,.35);border-radius:8px;padding:10px 12px;font-size:13px}
.empty{color:var(--muted);padding:22px 4px;text-align:center}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.empty .btn,.empty button{margin-top:12px}

/* overview */
.summary{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.tile b{display:block;font-size:22px;color:var(--strong);font-variant-numeric:tabular-nums;line-height:1.25}
.tile b.long{font-size:15px;padding:4px 0 2px}
.tile small{color:var(--muted);font-size:12px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;position:relative;min-width:0}
.chart-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.chart-head h2{margin-right:auto;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend i,.tip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;padding:4px 10px;min-height:30px;background:none;color:var(--muted);font-size:12px}
.seg button:hover{background:var(--tint);color:var(--strong)}
.seg button.on{background:var(--btn);color:var(--on-accent)}
#chartBox{min-height:190px}
#chartBox svg{display:block}
#chartBox .hit:hover{fill:rgba(255,255,255,.04)}
.tbl{max-height:190px;overflow:auto}
.tip{position:absolute;pointer-events:none;background:var(--input);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;white-space:nowrap;z-index:2;line-height:1.6}
.tip .n{float:right;margin-left:14px;font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) auto;gap:10px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.acc-group{padding:14px 0 4px;font-weight:600}
.acc-group:first-child{padding-top:0}
.acc-group a{display:inline-flex;align-items:center;gap:8px;color:var(--text)}
.acc-group .acc-ava{width:24px;height:24px;font-size:12px}
.acc-group + .srow{border-top:0}
.srow .name{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.srow .name a{color:var(--text)}
.srow .info{font-size:13px;min-width:0}
.srow .info .muted{font-size:12px}
.srow .act{display:flex;gap:6px}
@media (max-width:900px){.summary{grid-template-columns:1fr}.srow{grid-template-columns:1fr auto}.srow .info{grid-column:1/-1;grid-row:2}}
.wins{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.win{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:linear-gradient(90deg,rgba(164,208,7,.16),rgba(164,208,7,.04));border:1px solid rgba(164,208,7,.4);border-radius:var(--radius);padding:10px 14px}
.win .big{font-size:20px}
.win .sp{flex:1}
.more{color:var(--muted);font-size:12px}
.support{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:-6px 0 16px;padding:8px 12px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);font-size:13px}
.support a,.support .linkish{color:var(--accent)}
.support .linkish{background:none;border:0;padding:0;min-height:0;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:normal;display:inline}
.support .sp{flex:1}
.support button{min-height:30px;padding:4px 10px;font-size:12px}
.give{display:flex;flex-wrap:wrap;gap:8px}

/* accounts */
.acc-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.acc-tab{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:4px;background:var(--panel);border:1px solid var(--line);color:var(--text);min-height:44px;font-weight:600}
.acc-tab:hover{text-decoration:none;border-color:var(--link);color:var(--strong);background:var(--panel)}
.acc-tab.on{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 28%,transparent),color-mix(in srgb,var(--accent) 8%,transparent));border-color:var(--accent);color:var(--strong)}
.acc-tab small{color:var(--muted);font-weight:500;background:rgba(0,0,0,.28);border-radius:3px;padding:0 7px}
button.acc-tab.add{background:none;border:1px dashed var(--field);color:var(--tint-ink);padding-left:12px}
button.acc-tab.add:hover{background:var(--tint);color:var(--strong);border-color:var(--link)}
.acc-ava{width:32px;height:32px;border-radius:4px;display:grid;place-items:center;color:var(--on-accent);font-weight:700;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.acc-ava.big{width:52px;height:52px;font-size:22px}
.acc-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.acc-t{flex:1;min-width:200px}
.acc-t h2{font-size:18px;color:var(--strong);margin-bottom:2px}
.acc-row .actions{display:flex;gap:8px;flex-wrap:wrap}
.acc-name{background:none;border:0;padding:0;min-height:0;color:var(--strong);font:inherit;font-size:18px;font-weight:600;gap:8px}
.acc-name svg.i{width:15px;height:15px;color:var(--muted);opacity:0;transition:opacity .15s}
.acc-name:hover,.acc-name:focus-visible{background:none;color:var(--link)}
.acc-name:hover svg.i,.acc-name:focus-visible svg.i{opacity:1}
.acc-form{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end}
.acc-form .acc-ava{align-self:start}
.acc-fields{min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
.acc-fields .f{min-width:0}
@media (max-width:700px){.acc-form{grid-template-columns:minmax(0,1fr)}.acc-form .acc-ava{display:none}.acc-form .actions{justify-content:flex-end}}

/* site cards and catalog */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;align-items:flex-start;gap:10px}
.card-head .pill{margin-left:auto}
.card-head .desc{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel2);border-radius:8px;padding:8px 10px;min-width:0}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.card .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.cat{border-style:dashed}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--tint-ink);background:var(--tint);border-radius:3px;padding:2px 7px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{font-size:12px;color:var(--muted)}
.bar .v{float:right;color:var(--text);font-variant-numeric:tabular-nums}
.bar .track{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:3px}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),#66c0f4);border-radius:99px}
.bar.full .fill{background:var(--warn)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a,.tabs button{border:0;background:none;border-bottom:2px solid transparent;border-radius:0;padding:10px 12px;color:var(--muted);min-height:40px;font-weight:500}
.tabs a:hover{text-decoration:none;color:var(--text)}
.tabs .on{color:var(--strong);border-bottom-color:var(--accent)}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.fieldset{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:14px}
.fieldset > h2{font-size:15px}
.fieldset > p{color:var(--muted);font-size:13px;margin-top:-8px}
.f label{display:block;font-size:13px;margin-bottom:5px;font-weight:500}
.f small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.chk{display:flex;gap:10px;align-items:flex-start}
.chk input{width:20px;height:20px;min-height:0;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.chk label{margin:0;font-weight:400}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.savebar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;justify-content:flex-end;background:var(--bg);padding:12px 0;border-top:1px solid var(--line);z-index:3}
@media (max-width:900px){.savebar{bottom:64px}}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.preset{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;white-space:normal;align-items:flex-start;cursor:pointer}
.preset b{font-size:14px}
.preset span{color:var(--muted);font-size:12px}
.preset:hover{background:var(--panel2);color:var(--text);border-color:var(--link)}
.preset.on{border-color:var(--link);box-shadow:inset 0 0 0 1px var(--link);background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* wizard */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:step}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:4px 12px;counter-increment:step;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.steps li::before{content:counter(step);grid-row:span 2;width:28px;height:28px;border-radius:3px;background:var(--btn);color:var(--on-accent);border:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.steps li h3{font-size:15px}
.steps li p{color:var(--muted);font-size:13px}
.steps li .btn{margin-top:8px;justify-self:start}

/* tables */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
tbody tr:hover td{background:color-mix(in srgb,var(--link) 6%,transparent)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;position:sticky;top:0;background:var(--panel);z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.ok{color:var(--ok)}td.skip{color:var(--muted)}
td.act{white-space:nowrap;text-align:right;width:1%}
td.act button{min-height:32px;padding:3px 8px;margin-left:4px}
td select{width:auto;min-height:32px;padding:3px 6px;font-size:12px}
.key{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--panel2);border-radius:6px;padding:2px 6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}
.toolbar .sp{flex:1}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:13px}
.log{height:min(62vh,640px);overflow:auto;padding:10px 14px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;background:var(--log-bg);border:1px solid var(--line);border-radius:var(--radius)}
.log .t{color:var(--muted)}.log .s{color:var(--muted)}.log .WARNING{color:var(--warn)}.log .ERROR{color:var(--bad)}.log .hit{color:#a4d007}
.log .DEBUG{color:var(--muted);opacity:.8}.log .old{opacity:.6}.log .lv{text-transform:uppercase;font-size:10px;letter-spacing:.04em}
.log details > summary{list-style:none;cursor:pointer}.log details > summary::-webkit-details-marker{display:none}
.log details > summary::after{content:' ▸';color:var(--muted)}.log details[open] > summary::after{content:' ▾'}
.log .facts{display:flex;flex-wrap:wrap;gap:2px 16px;margin:2px 0 6px 64px;color:var(--text);font-size:11.5px}.log .facts b{color:var(--muted);font-weight:500}
.log .rule{margin:8px 0;border-top:1px dashed var(--line);color:var(--muted);font-size:11px;text-align:center;padding-top:4px}

/* settings */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 12px;border-radius:3px;background:var(--panel);border:1px solid var(--line);color:var(--text)}
.chip:hover{text-decoration:none;background:var(--row-hover);color:var(--row-ink);border-color:transparent}
.chip.good{border-color:rgba(144,186,60,.55)}.chip.warn{border-color:rgba(224,165,38,.5)}
.sects .sect{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.sects .sect + .sect{margin-top:10px}
.sect > summary{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;list-style:none;border-radius:var(--radius)}
.sect > summary::-webkit-details-marker{display:none}
.sect > summary:hover{background:color-mix(in srgb,var(--link) 6%,transparent)}
.sect-ico{width:36px;height:36px;border-radius:4px;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--link);flex:none}
.sect-t{display:flex;flex-direction:column;min-width:0;flex:1}
.sect-t b{font-size:15px;font-weight:600}
.sect-dirty{font-size:12px;color:var(--warn);border:1px solid rgba(224,165,38,.45);border-radius:99px;padding:1px 8px}
.chev{transition:transform .15s;color:var(--muted)}
.sect[open] .chev{transform:rotate(180deg)}
.sect-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.sect-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.sect-foot .sp{flex:1}
.f.wide{grid-column:1/-1}
.f.span2{grid-column:span 2}
.sub-block{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
@media (max-width:600px){.f.span2{grid-column:auto}}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.quick,.picklist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pillbtn{min-height:30px;padding:3px 10px;border-radius:99px;font-size:12px}
.secret-set{display:flex;align-items:center;gap:10px;min-height:38px}
.okText{color:var(--ok);font-size:13px}.warnText{color:var(--warn)}
.howto{background:var(--panel2);border-radius:8px;padding:10px 12px}
.howto summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:500}
.howto ol{margin:10px 0 2px;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13px}
.howto ol b{color:var(--text)}
.addrs{display:flex;flex-direction:column;gap:8px}
.addr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel2);border-radius:8px;padding:8px 10px}
.addr .muted{min-width:170px}
.addr code{font-size:14px;flex:1;min-width:0;overflow-wrap:anywhere}
.numbered{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.numbered li::marker{color:var(--link);font-weight:700}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:var(--panel2);border-radius:5px;padding:1px 5px}
input.switch{appearance:none;-webkit-appearance:none;width:40px;height:22px;min-height:0;border-radius:99px;background:#3d4f63;border:0;position:relative;cursor:pointer;flex:none;margin:0;padding:0;transition:background .15s}
input.switch::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
input.switch:checked{background:var(--accent)}
input.switch:checked::after{transform:translateX(18px)}
@media (max-width:600px){.inline{flex-direction:column}.addr .muted{min-width:0;flex-basis:100%}}

/* dialogs and toast */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.7);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:10}
.modal{background:linear-gradient(180deg,#22364b 0%,var(--panel) 220px);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);border-radius:var(--radius);width:100%;max-width:560px;padding:20px}
.modal.wide{max-width:920px}
.modal h2{margin-bottom:12px}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.pv-sum{font-size:13px;display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.pv-table{max-height:55vh}
#login{max-width:360px;margin:12vh auto;background:var(--card);box-shadow:0 20px 50px rgba(0,0,0,.4);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
#login .brand{padding:0 0 16px}
#login .msg{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
#toast{position:fixed;bottom:18px;right:18px;display:flex;align-items:center;gap:12px;width:min(360px,calc(100vw - 32px));background:linear-gradient(135deg,#23384f 0%,var(--bar) 100%);border:1px solid rgba(102,192,244,.22);box-shadow:0 12px 30px rgba(0,0,0,.45);padding:11px 14px;border-radius:4px;z-index:20;animation:toastIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}}
#toast.bad{border-color:var(--bad);color:#f2a19c}
#toast .t-ico{width:44px;height:44px;flex:none;border-radius:4px;background:var(--mark);display:grid;place-items:center;color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
#toast .t-ico svg{width:24px;height:24px}
#toast .t-body{display:flex;flex-direction:column;min-width:0;line-height:1.4}
#toast .t-body b{color:var(--strong)}
#toast .t-body span{color:#a3adb6;font-size:13px}
@media (max-width:900px){#toast{bottom:84px;right:16px}}
@media (prefers-reduced-motion:reduce){#toast{animation:none}}

html.round{--radius:12px}
html.still *,html.still *::before,html.still *::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
html.light{color-scheme:light}
/* first-run tour */
.tour-target{position:relative;z-index:1000;box-shadow:0 0 0 3px var(--accent),0 0 0 9999px rgba(0,0,0,.62)!important;border-radius:var(--radius)}
.tour-card{position:fixed;z-index:1001;right:24px;bottom:24px;width:min(380px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--accent);border-radius:var(--radius);padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.tour-card.center{right:50%;bottom:50%;transform:translate(50%,50%);box-shadow:0 0 0 9999px rgba(0,0,0,.62),0 12px 40px rgba(0,0,0,.5)}
.tour-card h2{color:var(--strong);margin:8px 0 6px}.tour-card p{color:var(--text);line-height:1.55}
.tour-actions{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.tour-progress{display:flex;gap:4px}.tour-progress i{flex:1;height:3px;border-radius:2px;background:var(--line)}.tour-progress i.on{background:var(--accent)}
@media (max-width:700px){.tour-card{right:16px;left:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:auto}.tour-card.center{left:auto}}
.look{display:flex;flex-direction:column;gap:16px}.look .lbl{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.theme-card{flex-direction:column;align-items:flex-start;gap:8px;padding:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.theme-card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sw{display:flex;width:100%;height:34px;border-radius:3px;overflow:hidden;border:1px solid var(--line)}.sw i{flex:1}
.sw-store i:nth-child(1){background:#171a21}.sw-store i:nth-child(2){background:#1b2838}.sw-store i:nth-child(3){background:#66c0f4}
.sw-graphite i:nth-child(1){background:#16171a}.sw-graphite i:nth-child(2){background:#2b2d31}.sw-graphite i:nth-child(3){background:#a0a4ab}
.sw-midnight i:nth-child(1){background:#000}.sw-midnight i:nth-child(2){background:#0b0e13}.sw-midnight i:nth-child(3){background:#1d2530}
.sw-light i:nth-child(1){background:#fff}.sw-light i:nth-child(2){background:#eef2f6}.sw-light i:nth-child(3){background:#1b2733}
.accents{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.accents .dot{width:30px;height:30px;min-height:0;padding:0;border-radius:50%;border:2px solid transparent}
.accents .dot.on{border-color:var(--strong);box-shadow:0 0 0 2px var(--bg) inset}

html.light .log .hit{color:#3d7a00}
html.light .tip{box-shadow:0 6px 24px rgba(0,0,0,.15)}
</style>

const ATTRS = ['placeholder', 'title', 'aria-label', 'alt'];
function tr(text){
  if (!dict || !text || !/[А-Яа-яЁё]/.test(text)) return text;
  const whole = text.trim();
  if (dict[whole]) return text.replace(whole, dict[whole]);
  return text.replace(dictRe, m => dict[m] ?? m);
}
function translateNode(node){
  if (node.nodeType === 3) {
    const v = node.nodeValue;
    if (TRANSLATED.get(node) === v) return;
    const t = tr(v); if (t !== v) node.nodeValue = t;
    TRANSLATED.set(node, node.nodeValue);
  } else if (node.nodeType === 1) {
    if (node.closest('[data-notranslate],script,style,code,textarea')) return;
    // Only when something changed: rewriting an attribute that still holds
    // untranslated text (a game's or a profile's name) would wake the
    // observer again, for ever.
    for (const a of ATTRS) { const v = node.getAttribute(a); if (v && /[А-Яа-яЁё]/.test(v)) { const t = tr(v); if (t !== v) node.setAttribute(a, t); } }
    if (node.tagName === 'INPUT' && /^(button|submit)$/.test(node.type) && /[А-Яа-яЁё]/.test(node.value)) { const t = tr(node.value); if (t !== node.value) node.value = t; }
  }
}
function translateTree(root){
  if (!dict || !root) return;
  translateNode(root);
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode: n => n.nodeType === 1 && n.matches('[data-notranslate],script,style,code,textarea') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  while (walk.nextNode()) translateNode(walk.currentNode);
}
const observer = new MutationObserver(list => {
  for (const m of list) {
    if (m.type === 'characterData') translateNode(m.target);
    else if (m.type === 'attributes') translateNode(m.target);
    else m.addedNodes.forEach(n => n.nodeType === 3 ? (n.parentElement && !n.parentElement.closest('[data-notranslate],code,textarea') && translateNode(n)) : translateTree(n));
  }
});
const nativeConfirm = window.confirm.bind(window);
window.confirm = text => nativeConfirm(tr(text));
async function setLanguage(lang){
  lang = LOCALES[lang] ? lang : 'ru';
  document.documentElement.lang = lang;
  if (lang === 'ru') {
    const had = !!dict; dict = null; dictRe = null; observer.disconnect();
    if (had) location.reload();   // the Russian text is the page itself
    return;
  }
  try {
    dict = await (await fetch(`/i18n/${lang}.json`, {cache: 'no-cache'})).json();
  } catch { dict = null; return; }
  const keys = Object.keys(dict).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  dictRe = new RegExp(`(?<![\\p{L}])(?:${keys.join('|')})(?![\\p{L}])`, 'gu');
  document.title = tr(document.title);
  translateTree(document.body);
  observer.disconnect();
  observer.observe(document.body, {subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS});
}

/* ====================== dialogs ====================== */
function openModal(html, wide){
  lastFocus = document.activeElement;
  $('#modal').className = 'modal' + (wide ? ' wide' : ''); $('#modal').innerHTML = html;
  $('#overlay').classList.remove('hidden');
  $$('[data-close]', $('#modal')).forEach(b => b.onclick = closeModal);
  ($('input,textarea,select,button.primary', $('#modal')) || $('button', $('#modal')))?.focus();
}
function closeModal(){
  if ($('#overlay').classList.contains('hidden')) return;
  $('#overlay').classList.add('hidden'); previewSeq++; lastFocus?.focus?.();
}
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Tab' && !$('#overlay').classList.contains('hidden')) {   // keep focus inside the dialog
    const f = $$('a[href],button:not(:disabled),input,select,textarea', $('#modal'));
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
function confirmDialog(title, text, okLabel, danger){
  return new Promise(resolve => {
    openModal(`<h2 id="modalTitle">${esc(title)}</h2><p class="muted">${esc(text)}</p>
      <div class="row"><button data-close>Отмена</button><button class="${danger ? 'danger' : 'primary'}" id="confirmOk">${esc(okLabel)}</button></div>`);
    $('#confirmOk').onclick = () => { closeModal(); resolve(true); };
    $$('[data-close]', $('#modal')).forEach(b => b.onclick = () => { closeModal(); resolve(false); });
    $('#confirmOk').focus();
  });
}

async function loadSummary(){
  try { summary = await api('/api/summary?days=' + days); summaryAt = Date.now(); renderSummary(); } catch {}
}
function renderSummary(){
  if (!summary || !$('#tiles')) return;
  const S = summary.sites, entered = sum(S, s => s.entered), wins = sum(S, s => s.wins);
  const spent = S.filter(s => s.spentToday).map(s => `${s.spentToday} ${s.unit}`).join(' · ') || '0';
  const luck = entered ? (wins / entered * 100).toFixed(wins && wins / entered < .01 ? 2 : 1) + '%' : '—';
  renderSupportLine(wins);
  $('#tiles').innerHTML = [
    [sum(S, s => s.today), 'входов сегодня'], [spent, 'потрачено сегодня'],
    [wins, `выигрышей, ${sum(S, s => s.winsWeek)} за 7 дней`], [luck, `выигрышей на ${entered} входов`],
  ].map(([v, l]) => `<div class="tile"><b class="${String(v).length > 8 ? 'long' : ''}">${esc(v)}</b><small>${esc(l)}</small></div>`).join('');
  const shown = S.filter(s => s.entered || s.entries.some(Boolean));
  $('#legend').innerHTML = shown.map(s => `<span><i style="background:${SITE_COLOR(s.key)}"></i>${esc(s.title)}</span>`).join('');
  $$('#range button').forEach(b => b.classList.toggle('on', +b.dataset.days === days));
  $$('#chartMode button').forEach(b => b.classList.toggle('on', b.dataset.mode === chartMode));
  if (chartMode === 'table') renderChartTable(shown); else renderChart(shown);
}
const dayLabel = (d, long) => long ? new Date(d + 'T12:00').toLocaleDateString(LOCALE(), {weekday: 'short', day: 'numeric', month: 'long'}) : `${+d.slice(8)}.${d.slice(5, 7)}`;
function niceStep(max){ const raw = max / 4, mag = 10 ** Math.floor(Math.log10(raw || 1)), n = raw / mag; return Math.max(1, (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag); }
const topRounded = (x, y, w, h, r) => `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
function renderChart(S){
  const box = $('#chartBox'), D = summary.days;
  const totals = D.map((_, i) => sum(S, s => s.entries[i])), max = Math.max(0, ...totals);
  if (!max) { box.innerHTML = '<div class="empty">За этот период входов нет.</div>'; return; }
  const W = Math.max(260, box.clientWidth), H = 190, L = 30, B = 22, T = 8;
  const step = niceStep(max), top = Math.ceil(max / step) * step, y = v => T + (H - T - B) * (1 - v / top);
  const slot = (W - L) / D.length, bw = Math.max(3, Math.min(26, slot * .62));
  const every = Math.ceil(D.length / Math.max(2, Math.floor((W - L) / 44)));
  let grid = '', bars = '', labels = '', hits = '';
  for (let v = 0; v <= top; v += step) grid += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  D.forEach((d, i) => {
    const x = L + slot * i + (slot - bw) / 2, segs = S.filter(s => s.entries[i] > 0);
    let acc = 0;
    segs.forEach((s, j) => {
      const y0 = y(acc), y1 = y(acc + s.entries[i]); acc += s.entries[i];
      const h = Math.max(1, y0 - y1 - (j ? 2 : 0));   // 2 px of surface between stacked segments
      bars += j === segs.length - 1
        ? `<path d="${topRounded(x, y1, bw, h, Math.min(4, bw / 2, h))}" style="fill:${SITE_COLOR(s.key)}"/>`
        : `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" style="fill:${SITE_COLOR(s.key)}"/>`;
    });
    const lx = x + bw / 2, edge = lx > W - 18;
    if ((D.length - 1 - i) % every === 0) labels += `<text x="${edge ? W - 1 : lx}" y="${H - 6}" text-anchor="${edge ? 'end' : 'middle'}">${dayLabel(d)}</text>`;
    hits += `<rect class="hit" data-i="${i}" x="${L + slot * i}" y="${T}" width="${slot}" height="${H - T - B}" fill="transparent"/>`;
  });
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-size="11" style="fill:var(--muted)" role="img" aria-label="Входы по дням за ${D.length} дн., всего ${sum(totals, t => t)}. Подробно — во вкладке «Таблица».">${grid}${bars}${labels}${hits}</svg>`;
}
// What one site did on day i: entries, points (unknown for the command line
// bot's days) and wins.
function dayCell(s, i){
  // The command line bot's entries have no price: a day of only those shows
  // '?', a day shared with the farm shows what is known plus '?'.
  const cli = s.importedByDay?.[i] || 0;
  const spent = !cli ? `${s.spentByDay[i]} ${s.unit}` : cli >= s.entries[i] ? '? ' + s.unit : `${s.spentByDay[i]} ${s.unit} + ?`;
  return s.entries[i] ? `${s.entries[i]} вх. · ${spent}${s.winsByDay[i] ? ' · 🎉 ' + s.winsByDay[i] : ''}` : (s.winsByDay[i] ? '🎉 ' + s.winsByDay[i] : '—');
}
function renderChartTable(S){
  const D = summary.days, rows = D.map((d, i) => [d, i]).reverse().filter(([, i]) => S.some(s => s.entries[i] || s.winsByDay[i]));
  const imported = S.some(s => s.importedByDay?.some(Boolean));
  $('#chartBox').innerHTML = rows.length ? `<div class="tbl"><table><thead><tr><th>День</th>${S.map(s => `<th class="n">${esc(s.title)}</th>`).join('')}<th class="n">Всего</th></tr></thead><tbody>` +
    rows.map(([d, i]) => `<tr><td>${dayLabel(d, true)}</td>${S.map(s => `<td class="n">${dayCell(s, i)}</td>`).join('')}<td class="n">${sum(S, s => s.entries[i])} вх.</td></tr>`).join('') + '</tbody></table></div>' +
    (imported ? '<p class="small muted">«?» — дни бота командной строки: он не записывал цену раздач.</p>' : '')
    : '<div class="empty">За этот период входов нет.</div>';
}
function chartHover(e){
  const hit = e.target.closest('.hit'), tip = $('#tip');
  if (!hit || !summary) { tip.classList.add('hidden'); return; }
  const i = +hit.dataset.i, S = summary.sites.filter(s => s.entered || s.entries.some(Boolean));
  tip.innerHTML = `<b>${dayLabel(summary.days[i], true)}</b><br>` +
    S.map(s => `<i style="background:${SITE_COLOR(s.key)}"></i>${esc(s.title)}<span class="n">${dayCell(s, i)}</span>`).join('<br>') +
    `<br>Всего<span class="n">${sum(S, s => s.entries[i])} вх.</span>`;
  tip.classList.remove('hidden');
  const box = $('#chart').getBoundingClientRect(), w = tip.offsetWidth;
  let left = e.clientX - box.left + 14; if (left + w > box.width - 6) left = e.clientX - box.left - w - 14;
  tip.style.left = Math.max(6, left) + 'px'; tip.style.top = (e.clientY - box.top + 12) + 'px';
}

  renderAccTabs(id); renderAccHead(prof);
  const mine = profileSites(id), list = mine.filter(p => p.configured);
  paint(cards, list.length ? list.map(siteCard).join('') : `<div class="empty" style="grid-column:1/-1"><b>В учётке «${esc(prof.name)}» пока нет площадок</b>Выберите сайт ниже — подключение займёт пару минут.</div>`);

    if (mine.some(p => p.kind === base.kind && p.configured)) return '';
    if (prof.main) return catalogCard(base, `#/connect/${base.key}`);
    if (!base.multi) return sharedCard(base);
    const own = mine.find(p => p.kind === base.kind);
    return own ? catalogCard(own, `#/connect/${own.key}`, true) : catalogCard(base, `#/connect/${base.kind}/${id}`);
  }).join('') || `<div class="empty" style="grid-column:1/-1">Все площадки уже подключены в эту учётку.</div>`);

/* ---- settings form ---- */
function input(f, v){
  const id = 'f_' + f.name, help = f.help ? `<small id="${id}_h">${esc(f.help)}</small>` : '', desc = f.help ? `aria-describedby="${id}_h"` : '';
  if (f.kind === 'bool') return `<div class="f"><div class="chk"><input type="checkbox" class="switch" role="switch" id="${id}" name="${f.name}" ${v ? 'checked' : ''} ${desc}><label for="${id}">${esc(f.label)}</label></div>${help}</div>`;
  if (f.kind === 'secret' && v) return `<div class="f"><label for="${id}">${esc(f.label)}</label><div class="secret-set"><span class="okText">✓ Сохранено</span><button type="button" data-replace="${id}">Заменить</button></div>
    <textarea id="${id}" name="${f.name}" hidden autocomplete="off" spellcheck="false" placeholder="Новое значение" ${desc} style="min-height:42px"></textarea>${help}</div>`;
  let ctl;
  if (f.kind === 'select') ctl = `<select id="${id}" name="${f.name}" ${desc}>${f.options.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else if (f.kind === 'secret') ctl = `<textarea id="${id}" name="${f.name}" placeholder="${v ? 'Сохранено. Оставьте пустым, чтобы не менять' : 'Не задано'}" autocomplete="off" spellcheck="false" ${desc} style="min-height:${f.name === 'cookie' ? 90 : 42}px"></textarea>`;
  else if (f.kind === 'list') ctl = `<input id="${id}" name="${f.name}" value="${esc((v || []).join(', '))}" ${desc}>`;
  else ctl = `<input id="${id}" name="${f.name}" ${f.kind === 'int' ? 'inputmode="numeric"' : ''} value="${esc(v ?? '')}" ${desc}>`;
  return `<div class="f"><label for="${id}">${esc(f.label)}${f.kind === 'secret' && v ? ' <span class="muted">· сохранено</span>' : ''}</label>${ctl}${help}</div>`;
}
function groups(schema){
  const out = [];
  for (const f of schema) { const g = f.group || 'Прочее'; let last = out[out.length - 1]; if (!last || last.title !== g) out.push(last = {title: g, fields: []}); last.fields.push(f); }
  return out;
}
function readFields(schema, root){
  const values = {};
  for (const f of schema) { const el = $('#f_' + f.name, root); if (el) values[f.name] = f.kind === 'bool' ? el.checked : el.value; }
  return values;
}
async function renderSiteSettings(body, p){
  const s = await api(`/api/platforms/${p.key}/settings`);
  const schema = s.schema.filter(f => !s.connectFields.includes(f.name));
  body.innerHTML = `<form class="form" id="sform">
    ${s.presets.length ? `<section class="fieldset" aria-labelledby="hPresets"><h2 id="hPresets">Готовые наборы</h2><p>Применяет сразу несколько настроек. Потом их можно поправить по одной ниже.</p>
      <div class="presets">${s.presets.map(pr => `<button type="button" class="preset" data-preset="${pr.name}"><b>${esc(pr.title)}</b><span>${esc(pr.description)}</span></button>`).join('')}</div></section>` : ''}
    ${groups(schema).map(g => `<section class="fieldset"><h2>${esc(g.title)}</h2><div class="cols">${g.fields.map(f => input(f, s.values[f.name])).join('')}</div></section>`).join('')}

    <div class="savebar"><span class="muted small" id="dirty"></span><button class="primary" type="submit">Сохранить изменения</button></div></form>`;
  const form = $('#sform');

  $$('[data-preset]', form).forEach(b => b.onclick = async () => {

    catch (err) { toast(err.message, true); }
  };
}

function renderPreviewTab(body, p){
  body.innerHTML = `<div class="block"><p>Ферма посмотрит текущие раздачи и покажет, в какие вошла бы сейчас и почему пропустит остальные. Ничего не тратит и никуда не входит.</p>
    <div class="row" style="justify-content:flex-start"><button class="primary" id="runPreview">${icon('search')}Проверить сейчас</button></div></div><div id="pvOut" style="margin-top:16px"></div>`;

}
function openPreview(key){
  const p = byKey(key);
  openModal(`<h2 id="modalTitle">${esc(p.title)}: что ферма возьмёт сейчас</h2><div id="pvOut"></div><div class="row"><button data-close>Закрыть</button></div>`, true);
  runPreviewInto($('#pvOut'), p);
}
async function runPreviewInto(box, p){
  const seq = ++previewSeq;
  box.innerHTML = '<div class="empty">Смотрю раздачи на сайте. Ничего не трачу. Это может занять до минуты…</div>';
  let r;
  try { r = await api(`/api/platforms/${p.key}/preview`, {}); }
  catch (err) { if (seq === previewSeq) box.innerHTML = `<div class="err">${esc(err.message)}</div>`; return; }
  if (seq !== previewSeq || !box.isConnected) return;
  const take = r.items.filter(i => i.enter), cost = sum(take, i => i.cost || 0);
  const reasons = {}; r.items.filter(i => !i.enter).forEach(i => { reasons[i.reason] = (reasons[i.reason] || 0) + 1; });
  const skips = Object.entries(reasons).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${esc(k)}: ${v}`).join(', ');
  let filter = take.length ? 'enter' : 'all';
  box.innerHTML = `<div class="pv-sum">
      <div>Войдёт в <b>${take.length}</b> из ${r.items.length} раздач и потратит <b>${cost} ${esc(p.unit)}</b>${r.balance != null ? `. Баланс ${r.balance} → ${r.balance - cost} ${esc(p.unit)}` : ''}.</div>
      ${skips ? `<div class="muted">Пропустит: ${skips}.</div>` : ''}${r.note ? `<div class="muted">${esc(r.note)}</div>` : ''}</div>
    <div class="seg" id="pvFilter" role="group" aria-label="Показать" style="margin-bottom:10px"><button data-f="enter">Войдёт (${take.length})</button><button data-f="skip">Пропустит (${r.items.length - take.length})</button><button data-f="all">Все</button></div>
    <div class="table-wrap pv-table" id="pvTable"></div>`;
  const draw = () => {
    const rows = r.items.filter(i => filter === 'all' || (filter === 'enter') === i.enter);
    $('#pvTable', box).innerHTML = rows.length ? `<table><thead><tr><th>Раздача</th><th class="n">Цена</th><th class="n">Участников</th><th>Решение</th><th><span class="sr">Действия</span></th></tr></thead><tbody>` +
      rows.map(i => `<tr><td><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.name)}</a>${i.priority ? ` ${icon('star', 'приоритетная')}` : ''}</td>
        <td class="n">${i.cost ?? '—'}</td><td class="n">${i.entries ?? '—'}</td><td class="${i.enter ? 'ok' : 'skip'}">${i.enter ? '✓ войдёт' : esc(i.reason)}</td><td class="act">${listButtons(p.key, i.name)}</td></tr>`).join('') + '</tbody></table>'
      : '<div class="empty">Здесь пусто.</div>';
    $$('#pvFilter button', box).forEach(b => b.classList.toggle('on', b.dataset.f === filter));
  };
  $('#pvFilter', box).onclick = e => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; draw(); } };
  draw();
}

const ENTRY_LINE = /^(Вошёл|One more game|Would enter)/;
// What the sites attach to a log line, in the panel's words.
const DETAIL_LABEL = {cost: 'Цена', balance: 'Баланс после входа', entries: 'Участников', today: 'Входов за 24 ч', priority: 'Приоритетная', url: 'Ссылка'};
function detailList(d){
  return Object.entries(d).map(([k, v]) => `<span><b>${esc(DETAIL_LABEL[k] || k)}</b> ${k === 'url' && /^https:\/\//.test(v) ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v.replace(/^https:\/\/(www\.)?/, ''))}</a>` : esc(v)}</span>`).join('');
}
// 21:05:07 today, 19.11 21:05:07 on another day.
function logTime(t){
  const d = new Date(t * 1000), time = d.toLocaleTimeString(LOCALE(), {hour: '2-digit', minute: '2-digit', second: '2-digit'});
  return d.toDateString() === new Date().toDateString() ? time : `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')} ${time}`;
}
function logLines(){
  const keys = logSite === 'all' ? platforms.map(p => p.key) : [logSite];

  return keys.flatMap(k => (logBuf[k] || []).map(l => ({...l, site: byKey(k)?.title || k, key: k})))
    .filter(l => logLevel === 'verbose' || (l.level !== 'DEBUG' && (logLevel === 'all' || (logLevel === 'entries' ? ENTRY_LINE.test(l.text) : l.level !== 'INFO'))))
    .filter(l => words.every(w => l.text.toLowerCase().includes(w)))

}

      try {
        await api('/api/farm/settings', {values: readFields(g.fields, form)}); markDirty(form, false); toast(`${g.title}: сохранено`);
        const fresh = await api('/api/farm/settings'); farmConf = fresh;
        $('[data-sub]', form.closest('.sect')).innerHTML = sectionSub(g.title, fresh.values); $('#chips').innerHTML = statusChips(fresh.values);
        $$('.secret-set', form).forEach(x => x.remove());
      } catch (err) { $('.result', form).textContent = ''; toast(err.message, true); }
    };
  });
  $$('[data-autostart]', view).forEach(sw => sw.onchange = async () => {
    const title = byKey(sw.dataset.autostart).title;
    try { await api(`/api/platforms/${sw.dataset.autostart}/autostart`, {value: sw.checked}); toast(sw.checked ? `${title} будет запускаться вместе с фермой` : `Автозапуск ${title} выключен`); }
    catch (err) { sw.checked = !sw.checked; toast(err.message, true); }
  });
  // time zone picker
  const zone = $('#f_timezone');
  if (zone) {
    const show = () => { const t = zoneTime(zone.value.trim()); $('#zoneNow').textContent = t ? `Сейчас там ${t}` : 'Такого пояса нет — начните вводить город по-английски: Kyiv, Moscow…'; };
    zone.addEventListener('input', show); show();
    $('#zoneDetect').onclick = () => { zone.value = Intl.DateTimeFormat().resolvedOptions().timeZone; show(); markDirty(zone.form, true); };
    $$('[data-zone]').forEach(b => b.onclick = () => { zone.value = b.dataset.zone; show(); markDirty(zone.form, true); });
  }
  // Telegram chat finder
  const find = $('#findChats');
  if (find) find.onclick = async () => {
    find.disabled = true; const box = $('#chatList');
    try {
      const r = await api('/api/telegram/chats', {token: $('#f_telegram_token')?.value || ''});
      box.innerHTML = r.chats.length ? `<div class="picklist">${r.chats.map(c => `<button type="button" class="pillbtn" data-chat="${esc(c.id)}">${esc(c.title)} <span class="muted">${esc(c.id)}</span></button>`).join('')}</div>`
        : '<small class="warnText">Чатов не видно. Напишите своему боту любое сообщение в Telegram и нажмите ещё раз.</small>';
      $$('[data-chat]', box).forEach(b => b.onclick = () => { $('#f_telegram_chat').value = b.dataset.chat; markDirty(b.closest('form'), true); box.innerHTML = '<small>Чат выбран — нажмите «Сохранить».</small>'; });
    } catch (err) { box.innerHTML = `<small class="warnText">${esc(err.message)}</small>`; }
    find.disabled = false;
  };
  // phone tabs
  $('#phoneTabs')?.addEventListener('click', e => {
    const b = e.target.closest('[data-ptab]'); if (!b) return;
    $$('[data-ptab]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); });
    $$('[data-ppanel]').forEach(p => p.hidden = p.dataset.ppanel !== b.dataset.ptab);
  });
  $$('[data-act2]', view).forEach(b => b.onclick = async () => {
    const out = b.closest('form') && $('.result', b.closest('form'));
    if (b.dataset.act2 === 'logout-all' && !await confirmDialog('Выйти на всех других устройствах?', 'Телефоны и другие браузеры попросят пароль заново. Это устройство останется в панели.', 'Выйти на других')) return;
    b.disabled = true; if (out) out.textContent = 'Проверяю…';
    try { const r = await api('/api/' + b.dataset.act2, {}); const msg = r.message || 'Готово'; if (out) out.textContent = msg; toast(msg); }
    catch (err) { if (out) out.textContent = ''; toast(err.message, true); }
    b.disabled = false;
  });
  $('#pform').onsubmit = async e => {
    e.preventDefault();
    try { await api('/api/password', {current: $('#pcur').value, new: $('#pnew').value}); $('#pcur').value = $('#pnew').value = ''; toast('Пароль изменён, остальные устройства вышли'); }
    catch (err) { toast(err.message, true); }
  };
}
// Unsaved settings are not lost by a stray click on the menu.
window.addEventListener('beforeunload', e => { if (dirtyForms.size) { e.preventDefault(); e.returnValue = ''; } });

if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('/sw.js').catch(() => {});
boot().catch(() => showLogin());
</script>
</body>
</html>
